name: Compose CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: perry-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout DevOps
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare pinned application sources
        run: bash scripts/prepare_sources.sh

      - name: Create disposable CI secrets
        run: python3 scripts/init_env.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build application containers
        run: docker compose build

      - name: Start isolated application and wait for readiness
        run: docker compose up --wait --wait-timeout 180

      - name: Check accounts, persistence and SignalR through Nginx
        working-directory: frontend
        env:
          FATE_TEST_API: http://127.0.0.1:8080/api
          FATE_TEST_HUB: http://127.0.0.1:8080/hubs/chat
        run: npm run test:integration

      - name: Show container diagnostics on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose ps --all
            docker compose logs --no-color --tail=100
          fi

      - name: Remove disposable CI containers and data
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down --volumes --remove-orphans
          fi
