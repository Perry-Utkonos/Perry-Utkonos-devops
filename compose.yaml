name: perry-utkonos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fate
      POSTGRES_USER: fate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fate -d fate"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: src/ChatApp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=fate;Username=fate;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_is_required}
      ConnectionStrings__Redis: redis:6379
      Jwt__Issuer: chatapp
      Jwt__Audience: chatapp-clients
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY_is_required}
      Database__ApplyMigrations: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
